name: build-apk

on:
  workflow_dispatch:
  push:
    tags: ['v*']
    branches: ['arena/**']   # ВРЕМЕННО: отладка сборки

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK (platform 36 + build-tools 36.0.0)
        run: |
          SDK="$HOME/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          curl -fsSL --retry 3 -o /tmp/cmdtools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdtools.zip -d "$SDK/cmdline-tools"
          mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          chmod -R +x "$SDK/cmdline-tools/latest/bin" "$SDK/cmdline-tools/latest/lib"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" --licenses > /dev/null
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" \
            "platforms;android-36" "build-tools;36.0.0"
          echo "ANDROID_SDK=$SDK" >> "$GITHUB_ENV"

      - name: Зависимости (libv2ray / tor-android / jtorctl / kotlin-stdlib / lbc)
        run: |
          bash tools/fetch_deps.sh "$GITHUB_WORKSPACE/deps"
          ls -la deps

      - name: Версия из манифеста
        run: |
          V=$(grep -oP 'android:versionName="\K[^"]+' AndroidManifest.xml)
          echo "VERSION=$V" >> "$GITHUB_ENV"
          echo "Версия: $V"

      - name: Сборка APK
        run: |
          set -o pipefail
          ABIS="armeabi-v7a arm64-v8a" bash build.sh "$ANDROID_SDK" "$GITHUB_WORKSPACE/deps" 2>&1 | tee /tmp/build.log

      - name: Отладка (лог сборки в отдельную ветку)
        if: failure()
        run: |
          tail -c 20000 /tmp/build.log > /tmp/tail.txt || true
          git config user.name "ci"; git config user.email "ci@localhost"
          mkdir -p ci-log && cp /tmp/tail.txt ci-log/build.log
          git checkout -b "ci-log-${{ github.run_id }}"
          git add ci-log/build.log
          git commit -m "ci log ${{ github.run_id }}"
          git push origin "HEAD:ci-log-${{ github.run_id }}"

      - name: Проверка артефакта (жёсткие ассерты)
        run: |
          set -euo pipefail
          BT=$(ls -d "$ANDROID_SDK"/build-tools/* | sort -V | tail -1)
          export PATH="$BT:$PATH"
          mv WhitelistBypass.apk "WhitelistBypass-$VERSION.apk"
          APK="WhitelistBypass-$VERSION.apk"
          sha256sum "$APK" | tee apk.sha256
          {
            echo "### aapt2 badging"
            aapt2 dump badging "$APK" | grep -E "^package:|application-label|sdkVersion|targetSdkVersion|native-code"
            echo
            echo "### содержимое APK (фрагмент)"
            unzip -l "$APK" | grep -E "classes.dex|lib/.*\\.so|resources.arsc|AndroidManifest" | awk '{print $1, $4}'
            echo
            echo "### подпись"
            apksigner verify --print-certs "$APK" | grep -E "Verifies|Signer #1 certificate (DN|SHA-256)"
            echo
            echo "### размер"
            du -h "$APK"
          } 2>&1 | tee build-report.txt
          aapt2 dump badging "$APK" | grep -q "package: name='ru.whitelist.bypass'"
          aapt2 dump badging "$APK" | grep -q "versionName='$VERSION'"
          apksigner verify --print-certs "$APK" \
            | grep -qi "de18cb65d3aadc1f7b53372fe896565df2b40f51b9238e4ccef898206dc8d515" \
            || { echo "::error::подпись не совпадает с debug.keystore из репозитория"; exit 1; }
          unzip -l "$APK" | grep -q "classes.dex"
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libgojni.so"
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libtor.so"
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libbyedpi.so"
          sha256sum -c apk.sha256
          rm -f *.idsig

      - uses: actions/upload-artifact@v4
        with:
          name: WhitelistBypass-${{ env.VERSION }}
          path: |
            WhitelistBypass-${{ env.VERSION }}.apk
            apk.sha256
            build-report.txt

      - name: Публикация pre-release с APK
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NOTES="releases/$VERSION.md"
          if [ ! -f "$NOTES" ]; then
            echo "::error::нет файла $NOTES — заголовок и текст релиза берутся из него"
            exit 1
          fi
          TITLE=$(head -n 1 "$NOTES" | sed 's/^#*[[:space:]]*//')
          echo "Релиз: $TITLE"
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 && gh release delete "$GITHUB_REF_NAME" -y || true
          { tail -n +2 "$NOTES"
            printf '\n### Сборка\n\nGitHub Actions, коммит `%s`: JDK 17, Android SDK 36 (build-tools 36.0.0), подпись debug-ключом из репозитория.\n\n' "$GITHUB_SHA"
            printf '```\n'; cat build-report.txt; printf '```\n'
          } > /tmp/body.md
          gh release create "$GITHUB_REF_NAME" \
            "WhitelistBypass-$VERSION.apk" apk.sha256 build-report.txt \
            --prerelease \
            --title "$TITLE" \
            --notes-file /tmp/body.md
