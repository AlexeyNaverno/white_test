name: build-apk

on:
  workflow_dispatch:
  push:
    tags: ['v*']
    branches: ['arena/**']   # ВРЕМЕННО: отладка сборки

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # нативные исходники (ciadpi, hev-socks5-tunnel, Xray-core) — git-сабмодули
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK (platform 35, build-tools 35.0.0, NDK 26.3)
        run: |
          SDK="$HOME/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          curl -fsSL --retry 3 -o /tmp/cmdtools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdtools.zip -d "$SDK/cmdline-tools"
          mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          chmod -R +x "$SDK/cmdline-tools/latest/bin" "$SDK/cmdline-tools/latest/lib"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" --licenses > /dev/null
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" \
            "platforms;android-35" "build-tools;35.0.0" "ndk;26.3.11579264"
          echo "ANDROID_SDK=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$SDK/ndk/26.3.11579264" >> "$GITHUB_ENV"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Xray-core (libv2ray.aar)
        run: |
          bash tools/fetch-libv2ray.sh
          ls -la libs

      - name: Версия из gradle.properties
        run: |
          V=$(grep -oP '^appVersionName=\K.*' gradle.properties)
          echo "VERSION=$V" >> "$GITHUB_ENV"
          echo "Версия: $V"

      - name: Сборка APK (Gradle + NDK)
        run: |
          set -o pipefail
          gradle --no-daemon assembleRelease 2>&1 | tee /tmp/build.log

      - name: Лог сборки в артефакт (при падении)
        if: failure()
        run: |
          tail -c 60000 /tmp/build.log > build-log.txt 2>/dev/null || true
          echo "### Последние строки лога" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -n 40 /tmp/build.log >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Загрузить лог сборки
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_id }}
          path: build-log.txt
          if-no-files-found: ignore

      - name: Проверка артефакта (жёсткие ассерты)
        run: |
          set -euo pipefail
          BT=$(ls -d "$ANDROID_SDK"/build-tools/* | sort -V | tail -1)
          export PATH="$BT:$PATH"
          SRC_APK=$(find build/outputs/apk/release -name '*.apk' | head -1)
          [ -n "$SRC_APK" ] || { echo "::error::Gradle не собрал APK"; exit 1; }
          mv "$SRC_APK" "WhitelistBypass-$VERSION.apk"
          APK="WhitelistBypass-$VERSION.apk"
          sha256sum "$APK" | tee apk.sha256
          {
            echo "### aapt2 badging"
            aapt2 dump badging "$APK" | grep -E "^package:|application-label|sdkVersion|targetSdkVersion|native-code"
            echo
            echo "### содержимое APK (фрагмент)"
            unzip -l "$APK" | grep -E "classes.dex|lib/.*\.so|resources.arsc|AndroidManifest" | awk '{print $1, $4}'
            echo
            echo "### подпись"
            apksigner verify --print-certs "$APK" | grep -E "Verifies|Signer #1 certificate (DN|SHA-256)"
            echo
            echo "### размер"
            du -h "$APK"
          } 2>&1 | tee build-report.txt
          aapt2 dump badging "$APK" | grep -q "package: name='ru.whitelist.bypass'"
          aapt2 dump badging "$APK" | grep -q "versionName='$VERSION'"
          apksigner verify --print-certs "$APK" \
            | grep -qi "de18cb65d3aadc1f7b53372fe896565df2b40f51b9238e4ccef898206dc8d515" \
            || { echo "::error::подпись не совпадает с debug.keystore из репозитория"; exit 1; }
          unzip -l "$APK" | grep -q "classes.dex"
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libgojni.so"
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libtor.so"
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libbyedpi.so"
          sha256sum -c apk.sha256
          rm -f *.idsig

      - uses: actions/upload-artifact@v4
        with:
          name: WhitelistBypass-${{ env.VERSION }}
          path: |
            WhitelistBypass-${{ env.VERSION }}.apk
            apk.sha256
            build-report.txt

      - name: Публикация pre-release с APK
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NOTES="releases/$VERSION.md"
          if [ ! -f "$NOTES" ]; then
            echo "::error::нет файла $NOTES — заголовок и текст релиза берутся из него"
            exit 1
          fi
          TITLE=$(head -n 1 "$NOTES" | sed 's/^#*[[:space:]]*//')
          echo "Релиз: $TITLE"
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 && gh release delete "$GITHUB_REF_NAME" -y || true
          { tail -n +2 "$NOTES"
            printf '\n### Сборка\n\nGitHub Actions, коммит `%s`: JDK 17, Android SDK 35 (build-tools 35.0.0), NDK 26.3, Gradle 8.9; подпись debug-ключом из репозитория.\n\n' "$GITHUB_SHA"
            printf '```\n'; cat build-report.txt; printf '```\n'
          } > /tmp/body.md
          gh release create "$GITHUB_REF_NAME" \
            "WhitelistBypass-$VERSION.apk" apk.sha256 build-report.txt \
            --prerelease \
            --title "$TITLE" \
            --notes-file /tmp/body.md
