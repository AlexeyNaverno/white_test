name: build-apk

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK (platform 36 + build-tools 36.0.0)
        run: |
          SDK="$HOME/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          curl -fsSL --retry 3 -o /tmp/cmdtools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdtools.zip -d "$SDK/cmdline-tools"
          mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          chmod -R +x "$SDK/cmdline-tools/latest/bin" "$SDK/cmdline-tools/latest/lib"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" --licenses > /dev/null
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" \
            "platforms;android-36" "build-tools;36.0.0"
          echo "ANDROID_SDK=$SDK" >> "$GITHUB_ENV"

      - name: Зависимости (libv2ray / tor-android / jtorctl / kotlin-stdlib / lbc)
        run: |
          bash tools/fetch_deps.sh "$GITHUB_WORKSPACE/deps"
          ls -la deps

      - name: Сборка APK
        run: ABIS="armeabi-v7a arm64-v8a" bash build.sh "$ANDROID_SDK" "$GITHUB_WORKSPACE/deps"

      - name: Проверка артефакта (жёсткие ассерты)
        run: |
          set -euo pipefail
          BT=$(ls -d "$ANDROID_SDK"/build-tools/* | sort -V | tail -1)
          export PATH="$BT:$PATH"
          {
            echo "### aapt2 badging"
            aapt2 dump badging WhitelistBypass.apk | grep -E "^package:|application-label|sdkVersion|targetSdkVersion|native-code"
            echo
            echo "### содержимое APK"
            unzip -l WhitelistBypass.apk | grep -E "classes.dex|lib/|resources.arsc|AndroidManifest" | sed 's/  */ /g'
            echo
            echo "### подпись"
            apksigner verify --print-certs WhitelistBypass.apk | grep -E "Verifies|Signer #1 certificate (DN|SHA-256)"
            echo
            echo "### контрольная сумма"
            sha256sum WhitelistBypass-0.0.1.apk
          } 2>&1 | tee build-report.txt
          # ассерты: без них шаг зелёный даже при «не том» APK
          aapt2 dump badging WhitelistBypass.apk | grep -q "package: name='ru.whitelist.bypass'"
          aapt2 dump badging WhitelistBypass.apk | grep -q "versionName='0.0.1'"
          apksigner verify --print-certs WhitelistBypass.apk \
            | grep -qi "de18cb65d3aadc1f7b53372fe896565df2b40f51b9238e4ccef898206dc8d515" \
            || { echo "::error::подпись не совпадает с debug.keystore из репозитория"; exit 1; }
          unzip -l WhitelistBypass.apk | grep -q "classes.dex"
          unzip -l WhitelistBypass.apk | grep -q "lib/arm64-v8a/libgojni.so"
          unzip -l WhitelistBypass.apk | grep -q "lib/arm64-v8a/libtor.so"
          unzip -l WhitelistBypass.apk | grep -q "lib/arm64-v8a/libbyedpi.so"
          sha256sum -c apk.sha256
          rm -f *.idsig WhitelistBypass.apk
          mv WhitelistBypass-0.0.1.apk WhitelistBypass.apk 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: WhitelistBypass-0.0.1
          path: |
            WhitelistBypass.apk
            apk.sha256
            build-report.txt

      - name: Черновик релиза с APK
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 && gh release delete "$GITHUB_REF_NAME" -y || true
          cp WhitelistBypass.apk WhitelistBypass-0.0.1.apk
          { cat RELEASE_NOTES.md
            printf '\n### Сборка\n\nСобрано на GitHub Actions из коммита `%s` (JDK 17, build-tools 36.0.0).\n\n' "$GITHUB_SHA"
            printf '```\n'; cat build-report.txt; printf '```\n'
          } > /tmp/body.md
          gh release create "$GITHUB_REF_NAME" \
            WhitelistBypass-0.0.1.apk apk.sha256 build-report.txt \
            --draft \
            --title "0.0.1 — VPN в одну кнопку: пул рабочих конфигов по скорости" \
            --notes-file /tmp/body.md
