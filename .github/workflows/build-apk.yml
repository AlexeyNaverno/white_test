name: build-apk

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK (platform 36 + build-tools 36.0.0)
        run: |
          SDK="$HOME/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          curl -fsSL --retry 3 -o /tmp/cmdtools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdtools.zip -d "$SDK/cmdline-tools"
          mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          chmod -R +x "$SDK/cmdline-tools/latest/bin" "$SDK/cmdline-tools/latest/lib"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" --licenses > /dev/null
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK" \
            "platforms;android-36" "build-tools;36.0.0"
          echo "ANDROID_SDK=$SDK" >> "$GITHUB_ENV"

      - name: Зависимости (libv2ray / tor-android / jtorctl / kotlin-stdlib / lbc)
        run: |
          bash tools/fetch_deps.sh "$GITHUB_WORKSPACE/deps"
          ls -la deps

      - name: Сборка APK
        run: ABIS="armeabi-v7a arm64-v8a" bash build.sh "$ANDROID_SDK" "$GITHUB_WORKSPACE/deps"

      - name: Проверка артефакта
        run: |
          BT=$(ls -d "$ANDROID_SDK"/build-tools/* | sort -V | tail -1)
          export PATH="$BT:$PATH"
          aapt2 dump badging WhitelistBypass.apk | grep -E "package:|application-label|sdkVersion"
          apksigner verify --print-certs WhitelistBypass.apk | grep -E "SHA-256|Verifies"
          sha256sum WhitelistBypass.apk | tee apk.sha256
          rm -f *.idsig
          mv WhitelistBypass.apk WhitelistBypass-0.0.1.apk

      - uses: actions/upload-artifact@v4
        with:
          name: WhitelistBypass-0.0.1
          path: |
            WhitelistBypass-0.0.1.apk
            apk.sha256
