# Версия приложения: единственный источник правды для Gradle, CI и F-Droid-рецепта.
appVersionCode=15
appVersionName=0.1.5

# Какие ABI собирать. Переопределяется: ./gradlew assembleRelease -Pabis=arm64-v8a
abis=armeabi-v7a,arm64-v8a

# Зависимости (tor-android, libv2ray.aar) требуют compileSdk 37, а AGP 8.7.3 официально
# тестировался до 35 — это только предупреждение, гасим его явно.
android.suppressUnsupportedCompileSdk=37
android.useAndroidX=true
android.nonTransitiveRClass=true
org.gradle.jvmargs=-Xmx2560m -Dfile.encoding=UTF-8
org.gradle.parallel=true
